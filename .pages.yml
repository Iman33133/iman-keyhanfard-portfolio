media:
  - name: images
    label: Images
    input: media/images
    output: /media/images
    rename: safe
    categories: [image]
  - name: documents
    label: Documents
    input: media/documents
    output: /media/documents
    rename: safe
    categories: [document]
  - name: audio
    label: Audio
    input: media/audio
    output: /media/audio
    rename: safe
    categories: [audio]
content:
  - name: sections
    label: Website Sections & Tabs
    type: collection
    path: content/sections
    format: json
    filename: "{primary}.json"
    view:
      primary: label_en
      sort: order
      order: asc
    fields:
      - name: name
        label: Internal name
        type: string
        required: true
      - name: slug
        label: Section ID / slug
        type: string
        required: true
      - name: label_en
        label: English tab title
        type: string
        required: true
      - name: label_fa
        label: Persian tab title
        type: string
      - name: description_en
        label: English description
        type: text
      - name: description_fa
        label: Persian description
        type: text
      - name: order
        label: Menu order
        type: number
      - name: visible
        label: Show in website navigation
        type: boolean
      - name: layout
        label: Content layout
        type: select
        options:
          values: [article-list, portfolio-grid, photo-gallery, video-gallery, mixed]
  - name: posts
    label: News & Articles
    type: collection
    path: content/posts
    format: json
    filename: "{primary}.json"
    view:
      primary: title_en
      sort: publication_date
      order: desc
    fields:
      - name: title_en
        label: Headline (English)
        type: string
        required: true
      - name: title_fa
        label: Headline (Persian)
        type: string
      - name: subtitle_en
        label: Subtitle (English)
        type: text
      - name: subtitle_fa
        label: Subtitle (Persian)
        type: text
      - name: slug
        label: URL slug
        type: string
        required: true
      - name: section
        label: Section slug
        type: string
        required: true
      - name: category
        label: Category
        type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: excerpt_en
        label: Summary (English)
        type: text
      - name: excerpt_fa
        label: Summary (Persian)
        type: text
      - name: body_en
        label: Article body (English)
        type: rich-text
      - name: body_fa
        label: Article body (Persian)
        type: rich-text
      - name: cover_image
        label: Featured image
        type: image
        options:
          media: images
      - name: gallery
        label: Additional images
        type: image
        list: true
        options:
          media: images
      - name: audio_file
        label: Audio file
        type: file
        options:
          media: audio
      - name: video_url
        label: Video URL (YouTube / Vimeo / other host)
        type: string
      - name: source_url
        label: Original source URL
        type: string
      - name: author
        label: Byline
        type: string
      - name: publication_date
        label: Publication date
        type: date
        time: true
      - name: featured
        label: Feature on homepage
        type: boolean
      - name: status
        label: Publication status
        type: select
        options:
          values: [draft, published]
  - name: portfolio
    label: Portfolio & Media Projects
    type: collection
    path: content/portfolio
    format: json
    filename: "{primary}.json"
    view:
      primary: title_en
      sort: order
      order: asc
    fields:
      - name: title_en
        label: Project title (English)
        type: string
        required: true
      - name: title_fa
        label: Project title (Persian)
        type: string
      - name: slug
        label: Project slug
        type: string
        required: true
      - name: section
        label: Section slug
        type: string
      - name: project_type
        label: Media type
        type: select
        options:
          values: [video, photo, article, interview, audio, research, translation, other]
      - name: role_en
        label: My role (English)
        type: text
      - name: role_fa
        label: My role (Persian)
        type: text
      - name: description_en
        label: Description (English)
        type: rich-text
      - name: description_fa
        label: Description (Persian)
        type: rich-text
      - name: thumbnail
        label: Cover image
        type: image
        options:
          media: images
      - name: gallery
        label: Photo gallery
        type: image
        list: true
        options:
          media: images
      - name: video_url
        label: Video URL
        type: string
      - name: original_url
        label: Original publication / source URL
        type: string
      - name: date
        label: Project date
        type: date
      - name: tags
        label: Tags
        type: string
        list: true
      - name: order
        label: Display order
        type: number
      - name: featured
        label: Feature on homepage
        type: boolean
      - name: status
        label: Publication status
        type: select
        options:
          values: [draft, published]
  - name: experience
    label: Professional Experience
    type: collection
    path: content/experience
    format: json
    filename: "{primary}.json"
    view:
      primary: organization_en
      sort: order
      order: asc
    fields:
      - name: organization_en
        label: Organization (English)
        type: string
        required: true
      - name: organization_fa
        label: Organization (Persian)
        type: string
      - name: role_en
        label: Role (English)
        type: string
      - name: role_fa
        label: Role (Persian)
        type: string
      - name: period
        label: Period
        type: string
      - name: description_en
        label: Description (English)
        type: rich-text
      - name: description_fa
        label: Description (Persian)
        type: rich-text
      - name: capabilities_en
        label: Capabilities (English)
        type: string
        list: true
      - name: capabilities_fa
        label: Capabilities (Persian)
        type: string
        list: true
      - name: order
        label: Display order
        type: number
      - name: visible
        label: Visible on website
        type: boolean
  - name: services
    label: Services
    type: collection
    path: content/services
    format: json
    filename: "{primary}.json"
    view:
      primary: title_en
      sort: order
      order: asc
    fields:
      - name: title_en
        label: Service title (English)
        type: string
        required: true
      - name: title_fa
        label: Service title (Persian)
        type: string
      - name: slug
        label: Service ID
        type: string
        required: true
      - name: intro_en
        label: Introduction (English)
        type: text
      - name: intro_fa
        label: Introduction (Persian)
        type: text
      - name: details_en
        label: Service details (English)
        type: string
        list: true
      - name: details_fa
        label: Service details (Persian)
        type: string
        list: true
      - name: icon
        label: Icon name
        type: string
      - name: order
        label: Display order
        type: number
      - name: visible
        label: Visible on website
        type: boolean
  - name: site_settings
    label: Website Settings & Contact
    type: file
    path: content/site-settings.json
    format: json
    fields:
      - name: site_title
        label: Website title
        type: string
      - name: tagline_en
        label: English tagline
        type: text
      - name: tagline_fa
        label: Persian tagline
        type: text
      - name: email
        label: Contact email
        type: string
      - name: phone
        label: Contact phone
        type: string
      - name: linkedin
        label: LinkedIn URL
        type: string
      - name: whatsapp
        label: WhatsApp URL
        type: string
      - name: profile_image
        label: Profile image
        type: image
        options:
          media: images
      - name: seo_description_en
        label: SEO description (English)
        type: text
      - name: seo_description_fa
        label: SEO description (Persian)
        type: text
settings:
  commit:
    templates:
      create: "content: add {filename}"
      update: "content: update {filename}"
      delete: "content: remove {filename}"